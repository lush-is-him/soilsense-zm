# Spec 6.2. Manure is tonnes per hectare (C-5); per-lima values are derived.
rules:
  - id: CROP-MAIZE
    domain: crop
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: "D, G1, D2"
    ph_method: water
    notes: "AGR-1 values confirmed by AGR-2 (Nov 2026 form, 'Agree'); pH in water (AGR-2). Fertiliser rates are AGR-2 input only."
    data:
      name: maize
      in_scope: true
      ph: {lowest_workable: 5.5, best: [5.5, 6.8], highest_workable: 7.5}
      acid_tolerance: low-medium
      planting_window_rainfed: [Nov, Dec]
      spacing_cm: [75, 25]
      basal: {product: "Compound D", rate_kg_ha: [200, 350]}
      top_dress: {product: "Urea (46% N) or CAN, two splits: 3-4 and 6-8 weeks after emergence", rate_kg_ha: [150, 350]}
      manure_t_ha: [5, 15]
      acid_soil_problem: "poor root growth and nutrient availability"
      cautions: [MSG-06]
  - id: CROP-SOYBEAN
    domain: crop
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: "D, G3"
    ph_method: water
    notes: "AGR-1 values confirmed by AGR-2 (Nov 2026 form, 'Agree'); pH in water (AGR-2). Fertiliser rates are AGR-2 input only."
    data:
      name: soybean
      in_scope: true
      ph: {lowest_workable: 5.5, best: [5.8, 7.0], highest_workable: 7.5}
      acid_tolerance: low
      planting_window_rainfed: [Nov, Dec]
      spacing_cm: [45, 5]
      basal: {product: "phosphorus-based fertiliser, according to soil test", rate_kg_ha: [150, 200]}
      top_dress: {product: "none", none: true}   # AGR-2 follow-up N6 (10 Nov 2026): no top dressing
      manure_t_ha: [5, 10]
      acid_soil_problem: "poor nodulation and phosphorus availability"
      cautions: [MSG-05]
  - id: CROP-SUNFLOWER
    domain: crop
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: D
    ph_method: water
    notes: "AGR-1 values confirmed by AGR-2 (Nov 2026 form, 'Agree'); pH in water (AGR-2). Fertiliser rates are AGR-2 input only."
    data:
      name: sunflower
      in_scope: true
      ph: {lowest_workable: 5.0, best: [6.0, 7.5], highest_workable: 8.5}
      acid_tolerance: medium
      planting_window_rainfed: [Dec, Jan]
      spacing_cm: [75, 30]
      basal: {product: "Compound D", rate_kg_ha: [150, 200]}
      top_dress: {product: "Urea or CAN, plus boron and potassium", rate_kg_ha: [100, 150]}
      manure_t_ha: [10, 20]
      acid_soil_problem: "poor root development and nutrient availability"
      cautions: []
  - id: CROP-MILLET
    domain: crop
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: D
    ph_method: water
    notes: "AGR-1 values confirmed by AGR-2 (Nov 2026 form, 'Agree'); pH in water (AGR-2). Fertiliser rates are AGR-2 input only."
    data:
      name: millet
      in_scope: true
      ph: {lowest_workable: 4.8, best: [5.5, 7.0], highest_workable: 7.5}
      acid_tolerance: medium-high
      planting_window_rainfed: [Nov, Dec]
      spacing_cm: [45, 10]
      basal: {product: "Compound D", rate_kg_ha: 150}
      top_dress: {product: "Urea", rate_kg_ha: [100, 150]}
      manure_t_ha: [3, 5]
      acid_soil_problem: "tolerance varies by species and variety"
      cautions: []
  - id: CROP-GROUNDNUT
    domain: crop
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: D
    ph_method: water
    notes: "C-1 decided (Nov 2026): groundnut replaces sorghum; AGR-2 also says groundnut should be in. Best range confirmed as 6.2-6.5 in AGR-2's follow-up (N7). AGR-1 values confirmed by AGR-2 (Nov 2026 form, 'Agree'); pH in water (AGR-2). Fertiliser rates are AGR-2 input only."
    data:
      name: groundnut
      in_scope: true
      ph: {lowest_workable: 5.0, best: [6.2, 6.5], highest_workable: 7.5}   # best range: AGR-2 follow-up N7
      acid_tolerance: medium
      planting_window_rainfed: [Nov, Dec]
      spacing_cm: [45, 10]
      basal: {product: "Compound D (AGR-2; AGR-1 said phosphorus-based)", rate_kg_ha: 200}
      top_dress: {product: "Gypsum", rate_kg_ha: [200, 400]}
      manure_t_ha: [5, 8]
      acid_soil_problem: "calcium availability"
      cautions: []
