# Spec 6.2. Manure is tonnes per hectare (C-5); per-lima values are derived.
rules:
  - id: CROP-MAIZE
    domain: crop
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-1
    ref: "D, G1, D2"
    ph_method: unconfirmed
    data:
      name: maize
      in_scope: true
      ph: {lowest_workable: 5.5, best: [5.5, 6.8], highest_workable: 7.5}
      acid_tolerance: low-medium
      planting_window_rainfed: [Nov, Dec]
      spacing_cm: [75, 25]
      basal: {product: "Compound D", rate_kg_ha: 200}
      top_dress: {product: "Urea (46% N) or CAN, two splits: 3-4 and 6-8 weeks after emergence", rate_kg_ha: OPEN}
      manure_t_ha: [5, 15]
      acid_soil_problem: "poor root growth and nutrient availability"
      cautions: [MSG-06]
