# Spec 6.5
rules:
  - id: PLAN-A
    domain: plan
    status: draft
    source_type: derived
    source_doc: null
    reviewer_alias: null
    ref: "spec 6.5"
    notes: "Lime by band and texture, clamped to the cap, plus timing, fertiliser, manure, cautions and re-test advice."
    data: {}
  - id: PLAN-B
    domain: plan
    status: draft
    source_type: proposed
    source_doc: null
    reviewer_alias: AGR-2
    ref: "I1, I2, E7 (C-2)"
    notes: >
      Structure is [PROPOSED]. Plan B takes the first N items of the
      agronomist's priority order (I2), N set by budget band, and uses the
      partial lime rate (LIME-PARTIAL, E7). It stays blocked while any of
      these is OPEN or CONFLICT. Items: lime, fertiliser, manure, seed.
    data:
      budget_bands: [low, medium]   # I1
      priority_order: [seed, fertiliser, lime, manure]   # I2, from AGR-2
      items_by_budget: {low: 2, medium: 3}   # AGR-2 follow-up B1-B2 (10 Nov 2026): low = first 2, medium = first 3
  - id: PLAN-C-ORDER
    domain: plan
    status: draft
    source_type: proposed
    source_doc: null
    reviewer_alias: null
    ref: "D1 (millet first); rest [PROPOSED]"
    ph_method: water
    notes: "In-scope crops whose workable pH range includes the farmer's pH; first preference first, then by lowest workable pH."
    data:
      first_preference: [millet]   # AGR D1
  - id: PLANT-SEASON
    domain: plan
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-3
    ref: "Review Nov 2026"
    notes: >
      AGR-3 disagreed with 19 of 30 situations, every time because the advice
      ignored the planting season: the situations were dated 1 August and the
      advice did not say to wait for the rains. Her own advice: lime and buy
      inputs first, then plant when the rains start, late October or early
      November. The crop's rain-fed window (crops.yaml) is used, opened
      early_start_days earlier to cover "late October".
    data:
      early_start_days: 12
  - id: NUT-P-LOW
    domain: plan
    status: draft
    source_type: derived
    source_doc: null
    reviewer_alias: AGR-3
    ref: "ZARI report 18 Nov 2026; review Nov 2026"
    notes: >
      All twenty Shimabala samples had 1-14 mg/L P (fifteen at 3 or less), whatever their
      pH, and AGR-3 advised a basal fertiliser (Compound D) in every situation she was
      shown. The threshold is [PROPOSED] pending an agronomist; it is applied only to a
      laboratory value, because the map's P did not match the lab (r = 0.11).
    data:
      p_below: 10      # mg per kg (the ZARI report gives mg/L) [PROPOSED]
