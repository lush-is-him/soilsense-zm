# Spec 6.3
rules:
  - id: LIME-PRODUCTS
    domain: lime
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-1
    ref: E2
    data:
      products: ["dolomitic lime", "calcitic lime"]
  - id: LIME-TARGET
    domain: lime
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: E3
    ph_method: water
    notes: "C-8: AGR-1 E3 5.5-6.5, G2 5.5-7; AGR-2 5.5-6.0. The range all answers share (5.5-6.0) is used: it also guards best against over-liming."
    data:
      target_ph: [5.5, 6.0]
  - id: LIME-TRIGGER
    domain: lime
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: E1
    ph_method: water
    notes: "C-3: AGR-2 says lime below pH 5.5 for maize (AGR-1 E1 said 5.5-6.2). For other crops AGR-2 wrote 5.1 to 6.1, which is unclear. The engine advises lime below 5.5 and calls 5.5-6.5 optional."
    data:
      trigger_ph: 5.5
      other_crops: OPEN   # AGR-2 wrote '5.1 to 6.1': ask what it means
  - id: LIME-RATES
    domain: lime
    status: verified
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: E4
    ph_method: water
    notes: "AGR-1 table (E4) confirmed by AGR-2 ('according to the international lime standards'; no document named)."
    data:
      rates_t_per_ha:
        severe:   {sandy: [1.0, 1.5], loamy: [2.0, 3.0], clay: [3.5, 5.0]}
        moderate: {sandy: [0.5, 1.0], loamy: [1.5, 2.0], clay: [2.5, 3.5]}
        slight:   {sandy: [0.0, 0.5], loamy: [0.5, 1.0], clay: [1.0, 1.5]}
        suitable: {sandy: [0, 0],     loamy: [0, 0],     clay: [0, 0]}
  - id: LIME-MAX
    domain: lime
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-1
    ref: E6
    notes: "E6 says 4 to 5 t/ha. AGR-2 answered 100000, which cannot be t/ha (probably a slip): 5 kept, ask again. Split guidance is OPEN."
    data:
      max_single_application_t_ha: 5
      split_guidance: OPEN
  - id: LIME-TEXTURE-REQUIRED
    domain: lime
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-1
    ref: C6
    data:
      texture_required: true
  - id: LIME-LEAD-TIME
    domain: lime
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: "E5, E10"
    notes: "C-7 resolved by majority: AGR-1 E5 says 2-3 months, AGR-2 says at least 3; AGR-1 E10 (1-2) is the outlier. The engine uses 2 to 3. Irrigated fields: any time (E5)."
    data:
      lead_time_before_planting_months: [2, 3]
      candidates_months: {E5: [2, 3], E10: [1, 2], AGR-2: [3, 3]}
  - id: LIME-RESIDUAL
    domain: lime
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-1
    ref: E9
    data:
      residual_effect_years: [3, 5]
      retest_after_years: [2, 3]
  - id: LIME-PARTIAL
    domain: lime
    status: agronomist_input
    source_type: expert_opinion
    source_doc: null
    reviewer_alias: AGR-2
    ref: E7
    notes: >
      C-2 resolved by AGR-2: 15 g of lime per planting station at 75 x 25 cm
      (about 0.8 t/ha), citing the Conservation Farming Unit (no document title).
      AGR-1 had given 50-100 g per basin and 200-400 kg/ha, which disagree.
    data:
      partial_approach: {method: per_station, g_per_station: [15, 15]}   # AGR-2, maize 75 x 25 cm, citing the Conservation Farming Unit (CFU)
