msg.MSG-01: {text: "Yesaninso nthaka pakatha zaka 2 kapena 3. Laimu imodzi imagwira ntchito zaka 3 mpaka 5.", reviewed: false}
msg.MSG-02: {text: "Laimu si feteleza. Simungasinthanitse laimu ndi feteleza.", reviewed: false}
msg.MSG-03: {text: "Musathire laimu yambiri kuposa momwe kuyesa nthaka kukunenera. Laimu yochuluka imachepetsa zokolola.", reviewed: false}
msg.MSG-04: {text: "Thirani laimu msanga ndipo muisakanize ndi nthaka. Imafunika chinyezi ndi nthawi kuti igwire ntchito.", reviewed: false}
msg.MSG-05: {text: "Soya: sakanizani mbewu ndi mankhwala a rhizobia oyenera, makamaka komwe soya sanalimidwe posachedwapa.", reviewed: false}
msg.MSG-06: {text: "Chimanga: gwiritsani ntchito mbewu yoyenera.", reviewed: false}
msg.MSG-07: {text: "Zolakwa zofala ndi feteleza: kuthira msanga kwambiri, mochedwa kwambiri, kapena osaganizira nyengo.", reviewed: false}
msg.MSG-08: {text: "Uku ndi kuthandiza kupanga chisankho chabe. Funsani mlangizi wa zaulimi kapena labu ya nthaka musanawononge ndalama zambiri.", reviewed: false}
ref.REF-01: {text: "Muyeso sunadutse kuyezedwa kwa khalidwe, choncho palibe malangizo. Yesaninso kapena lowetsani pH ya ku labu.", reviewed: false}
ref.REF-02: {text: "Nthaka ndi yowawasa kwambiri kuti tikulangizeni bwino. Tengani chitsanzo cha nthaka ku labu kapena kwa mlangizi wa zaulimi.", reviewed: false}
ref.REF-03: {text: "Kuchuluka kwa laimu kumafunika mtundu wa nthaka. Yesani nthaka ndi manja, kenako funsaninso.", reviewed: false}
ref.REF-04: {text: "pH ndi yokwera kuposa yomwe {crop} imapirira. Musathire laimu. Kayeseni nthaka ku labu.", reviewed: false}
ref.REF-05: {text: "Nthawi yothira laimu ya {crop} ya nyengo ino yadutsa. Tsatirani Ndondomeko C nyengo ino ndipo thirani laimu msanga nyengo ikubwerayi.", reviewed: false}
ref.REF-06: {text: "Malangizo amadalira momwe pH inayezedwera (ndi madzi kapena calcium chloride). Kayeseni nthaka ku labu musanagule laimu.", reviewed: false}
ref.REF-07: {text: "Laimu wochuluka chonchi ayenera kugawidwa ndi kuthiridwa kangapo.", reviewed: false}
plan.b_blocked: {text: "Ndondomeko yotsika mtengo sinawunikidwebe. Yambani ndi mbewu za Ndondomeko C ndipo kayeseni nthaka ku labu.", reviewed: false}
plan.c_none: {text: "Palibe mbewu m'dongosolo lino yomwe ingakule bwino m'nthaka iyi momwe ilili. Kayeseni nthaka ku labu.", reviewed: false}
lime.optional: {text: "Pa pH iyi laimu sikofunikira kwenikweni. Pang'ono ingathandize; kayeseni nthaka ku labu choyamba.", reviewed: false}
lime.not_needed: {text: "Pa pH iyi laimu sikufunika.", reviewed: false}
