<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f6b3f">
  <title>SoilSense ZM</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a href="#/fields" class="brand">SoilSense ZM</a>
    <nav>
      <a href="#/fields">Fields</a>
      <a href="#/probe">Probe</a>
      <a href="#/help">Sampling</a>
    </nav>
    <div class="topbar-right">
      <label class="sr-only" for="lang">Advice language</label>
      <select id="lang" title="Advice language">
        <option value="en">English</option>
        <option value="ny">Nyanja</option>
        <option value="toi">Tonga</option>
      </select>
      <button class="link" id="logout">Log out</button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
