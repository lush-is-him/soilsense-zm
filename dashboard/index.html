<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <title>SoilSense ZM</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="appbar">
      <a href="#/home" class="brand" aria-label="SoilSense ZM home">
        <img class="logo" src="/static/favicon.svg" alt="">
        <span>SoilSense ZM</span>
      </a>
      <div class="topbar-right">
        <label class="sr-only" for="lang">Advice language</label>
        <select id="lang" title="Advice language">
          <option value="en">English</option>
          <option value="toi">Tonga</option>
          <option value="ny">Nyanja</option>
        </select>
        <div class="who" id="whoami"></div>
        <button class="icon-btn" id="logout" title="Log out" aria-label="Log out">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
    <nav id="nav" class="tabbar" aria-label="Main"></nav>
  </header>

  <main id="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/static/app.js"></script>
  <script src="/static/animations.js"></script>
  <script src="/static/views.js"></script>
</body>
</html>
